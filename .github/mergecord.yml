# Mergecord configuration for the Vale community server.
#
# The bot (github.com/jdkato/mergecord) is generic; this file is what makes
# its deployment Vale's. The server's CONFIG_PATH is this file's raw URL,
# read once at startup, so edits take effect on `systemctl restart mergecord`.
#
# No secrets here: those come from the environment, and any string may
# reference one as ${VAR} or ${VAR:-default}.

project:
  name: Vale
  url: https://vale.sh

  # X handle, without the @. Only used to invite follows.
  twitter: jdkato

github:
  organization: vale-cli

  # Vale's GitHub Sponsors listing is on the maintainer's account.
  sponsors_account: jdkato

  # Contributions here roll up into one profile; releases flow into one channel.
  repositories:
    - vale
    - vale-ls
    - vale-action

    # The site and docs, and the style registry.
    - vale.sh
    - packages

    # First-party styles.
    - Google
    - Microsoft
    - Harper
    - MDX
    - Hugo
    - Joblint
    - alex
    - proselint
    - readability
    - write-good

  # Outside the organization: releases reach the feed, and contributions show
  # on a profile without counting towards the Contributor role. Styles are
  # deliberately absent; the package registry already credits their authors.
  external_repositories:
    - ChrisChinchilla/vale-vscode

opencollective:
  slug: vale

sponsors:
  page_url: https://vale.sh/sponsor

  # The two spotlighted on vale.sh/sponsor. Both were large one-time gifts,
  # so each carries its own name and url rather than relying on a subscription.
  spotlight:
    notes:
      mintlifydocs:
        note: Ships Vale as a built-in CI check
        name: Mintlify
        url: https://vale.sh/sponsors/mintlify
      promptless:
        note: Runs Vale on every doc its agents write
        name: Promptless
        url: https://vale.sh/sponsors/promptless

# Unanswered questions are surfaced to staff; answers endorsed with a ✅ are
# nudged toward the FAQ. Members see neither.
support:
  channel: support
  alert_channel: moderator-only

discord:
  guild_id: "${DISCORD_GUILD_ID}"

  # Names or IDs. Omit any you do not want used.
  channels:
    releases: releases
    project_feed: feed

    # One message here is edited in place as a live dashboard.
    status: status

# Keys are your own; Discord role names match case-insensitively, and
# /setup create:true makes any that are missing.
roles:
  # Automatic once a pull request is merged in any configured repository.
  contributor:
    name: Contributor
    color: "#57F287"
    hoist: true
    github:
      merged_pr: true
      minimum_merged_prs: 1

  # Active recurring support through either platform; revoked when it lapses.
  supporter:
    name: Supporter
    color: "#EB459E"
    hoist: true
    github_sponsors: true
    open_collective: true

  # Granted by hand with /recognize; reconciliation never touches it.
  maintainer:
    name: Maintainer
    color: "#5865F2"
    hoist: true
    manual: true

  # Automatic for anyone publishing a package listed in the registry.
  package_author:
    name: Package Author
    color: "#9B59B6"
    packages: true
    minimum_packages: 1

  # Major backers, $1000+ in total support, granted by hand. Also opens the
  # priority support channel. The key stays `partner` because manual grants
  # are recorded against it; renaming would orphan them.
  partner:
    name: Sponsor
    color: "#FEE75C"
    hoist: true
    manual: true

# Fold a Discord answer into the docs FAQ as a pull request.
faq:
  repository: vale.sh
  path: docs/guides/faq.md
  allowed_roles:
    - Maintainer
  branch_prefix: faq/

onboarding:
  # Linked from /contribute.
  contributing_url: https://github.com/vale-cli/vale/blob/v3/.github/CONTRIBUTING.md

  # Tried in order.
  good_first_issue_labels:
    - good first issue
    - help wanted

  # Greetings get their own channel so waves stay out of the feed.
  # Requires Server Members Intent.
  welcome_channel: welcome

# Promote a #showcase post into a pull request against the adopters list.
showcase:
  repository: vale.sh
  path: src/lib/data/adopters.json
  categories:
    - Cloud & infrastructure
    - Community & services
    - Data & observability
    - Developer tools
    - Enterprise
    - Open source
  allowed_roles:
    - Maintainer
  branch_prefix: showcase/

# Mirrors the site's events as Discord scheduled events. Needs Manage Events.
events:
  repository: vale.sh
  path: src/lib/data/events.json
  default_duration_minutes: 60

# Enables /packages, awards Package Author, and announces new listings.
packages:
  repository: packages
  path: library.json
  exclude_owners:
    - vale-cli
    - errata-ai

# New posts get a card in the feed: title, summary, banner and link.
blog:
  feed_url: https://vale.sh/blog/rss.xml

# Enables /docs. These are the public search-only credentials vale.sh already
# ships in its JavaScript.
algolia:
  app_id: 2Y8OU39U1X
  search_key: 0e82d6007f06d9f280629a37bb8a0892
  index: docsearch_mock

# Announces repositories newly tagged with the topic, for registry review.
# Topics are self-applied, so this never drives a role.
styles:
  github_topic: vale-linter-style

# Alternative /docs backend; wins over Algolia when both are set. Uncomment
# once GITBOOK_TOKEN and GITBOOK_SPACE_ID exist.
# gitbook:
#   space_id: "${GITBOOK_SPACE_ID}"
#   site_url: https://docs.vale.sh

# Turn a Discord message into a GitHub issue. Needs issue write access.
escalation:
  default_repository: vale
  allowed_roles:
    - Maintainer
  labels:
    - from-discord
  link_back: true

feed:
  # Merged pull requests with these labels get a feed post. Opt-in.
  significant_pr_labels: []
  #   - breaking-change
  #   - enhancement

  # Private sponsorships are acknowledged without a name; amounts never shown.
  announce_new_sponsors: true

  # Monthly: first-time contributors by name, plus the month's counts.
  monthly_recap: true

schedule:
  reconcile: 1h
  releases: 15m
  events: 1h
  blog: 1h
  dashboard: 15m

privacy:
  public_sponsor_amounts: false

  # The aggregate recurring monthly total, as vale.sh/sponsor already shows.
  public_funding_total: true
