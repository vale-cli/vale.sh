<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" width="800" height="444" role="img" aria-label="A rule's YAML with each key called out. extends is the check, what kind of thing is wrong. message is what to say. link is the guidance the rule enforces. The check's own argument comes next. level is how loudly. scope is where to look. action is the fix, applied without deciding anything. tokens is the pattern the check looks for.">
  <style>
    svg {
      --ink: #1c1917; --soft: #57534e; --faint: #a8a29e; --line: #d6d3d1;
      --surface: #f5f5f4; --band: #fafaf9; --accent: #55703a; --accent-fill: #eaf0e2;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #fafaf9; --soft: #d6d3d1; --faint: #78716c; --line: #44403c;
        --surface: #292524; --band: #211e1c; --accent: #a3c585; --accent-fill: #2b3323;
      }
    }
    .band { fill: var(--band); }
    .label { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; fill: var(--faint); }
    .node { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
    .mono { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); white-space: pre; }
    .mono-accent { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--accent); }
    .note { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: var(--soft); }
    .flow { stroke: var(--line); stroke-width: 1.25; fill: none; }
  </style>

  <rect class="band" x="0" y="0" width="800" height="444" rx="10"/>
  <text class="label" x="24" y="30">Four decisions, and a few settings</text>

  <rect class="node" x="48" y="56" width="420" height="364" rx="7"/>
  <text class="mono" x="66" y="80">extends: existence</text>
  <text class="mono" x="66" y="112">message: "Don't use end punctuation in headings."</text>
  <text class="mono" x="66" y="144">link: https://learn.microsoft.com/…/periods</text>
  <text class="mono" x="66" y="176">nonword: true</text>
  <text class="mono" x="66" y="208">level: warning</text>
  <text class="mono" x="66" y="240">scope: heading</text>
  <text class="mono" x="66" y="272">action:</text>
  <text class="mono" x="66" y="304" xml:space="preserve">  name: edit</text>
  <text class="mono" x="66" y="336" xml:space="preserve">  params: [trim_right, '.?!']</text>
  <text class="mono" x="66" y="368">tokens:</text>
  <text class="mono" x="66" y="400" xml:space="preserve">  - '[a-z][.?!]$'</text>

  <path class="flow" d="M468 76 h22"/>
  <text class="mono-accent" x="500" y="77">the check</text>
  <text class="note" x="500" y="92">what kind of thing is wrong</text>

  <path class="flow" d="M468 108 h22"/>
  <text class="mono-accent" x="500" y="109">the message</text>
  <text class="note" x="500" y="124">what to say when it fires</text>

  <path class="flow" d="M468 140 h22"/>
  <text class="mono-accent" x="500" y="141">the link</text>
  <text class="note" x="500" y="156">the guidance the rule enforces</text>

  <path class="flow" d="M468 172 h22"/>
  <text class="mono-accent" x="500" y="173">an argument</text>
  <text class="note" x="500" y="188">to the check itself</text>

  <path class="flow" d="M468 204 h22"/>
  <text class="mono-accent" x="500" y="205">the level</text>
  <text class="note" x="500" y="220">how loudly</text>

  <path class="flow" d="M468 236 h22"/>
  <text class="mono-accent" x="500" y="237">the scope</text>
  <text class="note" x="500" y="252">where to look</text>

  <path class="flow" d="M468 268 h22"/>
  <text class="mono-accent" x="500" y="269">the action</text>
  <text class="note" x="500" y="284">the fix, applied without deciding</text>

  <path class="flow" d="M468 364 h22"/>
  <text class="mono-accent" x="500" y="365">the pattern</text>
  <text class="note" x="500" y="380">what the check looks for</text>
</svg>
