[build]
functions = "lambda"
publish = "build"

# The documentation moved to docs.vale.sh, which GitBook publishes.
#
# The slugs were reorganised in the move, so the specific rules below come
# first and the catch-all last: Netlify takes the first rule that matches, and
# a bare /docs/* -> :splat would send a third of these to a 404. Every rule was
# checked against docs.vale.sh's sitemap.
#
# 301, because these URLs have been the documentation for years and are widely
# linked; the redirect should be cached and should carry search ranking over.

# Nine pages that were at the top level are now under topics/.
[[redirects]]
from = "/docs/install"
to = "https://docs.vale.sh/topics/installation"
status = 301
force = true

[[redirects]]
from = "/docs/vale-ini"
to = "https://docs.vale.sh/topics/.vale.ini"
status = 301
force = true

[[redirects]]
from = "/docs/actions"
to = "https://docs.vale.sh/topics/actions"
status = 301
force = true

[[redirects]]
from = "/docs/cli"
to = "https://docs.vale.sh/topics/cli"
status = 301
force = true

[[redirects]]
from = "/docs/filters"
to = "https://docs.vale.sh/topics/filters"
status = 301
force = true

[[redirects]]
from = "/docs/scopes"
to = "https://docs.vale.sh/topics/scopes"
status = 301
force = true

[[redirects]]
from = "/docs/styles"
to = "https://docs.vale.sh/topics/styles"
status = 301
force = true

[[redirects]]
from = "/docs/templates"
to = "https://docs.vale.sh/topics/templates"
status = 301
force = true

[[redirects]]
from = "/docs/views"
to = "https://docs.vale.sh/topics/views"
status = 301
force = true

# Sections and pages that were renamed.
[[redirects]]
from = "/docs/fixers/*"
to = "https://docs.vale.sh/fixes/:splat"
status = 301
force = true

[[redirects]]
from = "/docs/formats/rst"
to = "https://docs.vale.sh/formats/restructuredtext"
status = 301
force = true

[[redirects]]
from = "/docs/guides/glob"
to = "https://docs.vale.sh/guides/globbing"
status = 301
force = true

[[redirects]]
from = "/docs/keys/vocab"
to = "https://docs.vale.sh/keys/vocabularies"
status = 301
force = true

# `support` was an empty page and has no counterpart to point at.
[[redirects]]
from = "/docs/support"
to = "https://docs.vale.sh/"
status = 301
force = true

# Everything else kept its path: checks/, keys/, formats/, guides/,
# integrations/, and the index.
[[redirects]]
from = "/docs/*"
to = "https://docs.vale.sh/:splat"
status = 301
force = true

[[redirects]]
from = "/docs"
to = "https://docs.vale.sh/"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Content-Security-Policy = "default-src 'self'; connect-src 'self' https://raw.githubusercontent.com https://2y8ou39u1x-dsn.algolia.net https://2y8ou39u1x-2.algolianet.com https://2y8ou39u1x-3.algolianet.com https://vale.sh; font-src 'self' https://use.fontawesome.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://2y8ou39u1x-3.algolianet.com https://cdn.jsdelivr.net https://use.fontawesome.com https://opencollective.com https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://use.fontawesome.com https://opencollective.com https://cdnjs.cloudflare.com; img-src * data:; frame-src 'self' 'unsafe-inline' https://www.youtube.com https://opencollective.com https://static.cloudflareinsights.com"

[build.environment]
NODE_VERSION = "17.8.0"
NPM_VERSION = "8.5.5"
GO111MODULE = "on"

[context.production]
command = "make"

[context.deploy-preview]
command = "make preview"

[context.branch-deploy]
command = "make preview"

[context.next]
command = "make"

[context.next.environment]
HUGO_ENV = "next"

[[plugins]]
package = "netlify-plugin-submit-sitemap"

[plugins.inputs]
baseUrl = "https://vale.sh/"
ignorePeriod = 0
providers = [
  "google",
  "bing",
  "yandex",
]
sitemapPath = "/sitemap.xml"

[dev]
autoLaunch = false
command = "npm run start"
framework = "#custom"
port = 8888
publish = "public"
targetPort = 1313
