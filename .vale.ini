StylesPath = .github/styles

MinAlertLevel = suggestion

Vocab = Docs

[*.{md}]
BasedOnStyles = Vale

# GitBook writes its blocks as `{% hint %}`, `{% tabs %}` and so on. Markdown
# has no idea what those are, so Vale reads the directives as prose and reports
# `endhint` and `endstepper` as misspellings. They are markup: skip them.
TokenIgnores = ({%.*?%})
