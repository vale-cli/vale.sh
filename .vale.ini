StylesPath = .github/styles

MinAlertLevel = suggestion

Vocab = Docs

[*.{md}]
BasedOnStyles = Vale

# GitBook writes its blocks as `{% hint %}`, `{% tabs %}` and so on. Markdown
# has no idea what those are, so Vale reads the directives as prose and reports
# `endhint` and `endstepper` as misspellings. They are markup: skip them.
TokenIgnores = ({%.*?%})

# An mdsvex component whose props span lines -- `<TermApp` alone on its line
# -- is not a complete tag, so Markdown reads the props as prose. Skip the
# self-closing multi-line form; a single-line tag parses as HTML on its own,
# and a paired tag's body is prose that should stay linted.
BlockIgnores = (?s) *(<[A-Z][A-Za-z]*\n.*?/>)
