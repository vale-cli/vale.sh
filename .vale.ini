StylesPath = .github/styles

MinAlertLevel = suggestion

Vocab = Docs

# The rules behind /tools/ai-detector. They guide writers and agents locally;
# CI skips them (see config/filters/ci.expr). Modelese isn't in the library yet.
Packages = ai-tells, Prompts, https://github.com/jdkato/Modelese/releases/download/v0.2.0/Modelese.zip

[*.{md}]
BasedOnStyles = Vale, ai-tells, Modelese

# Off: these fire as often on the 2019 docs, written before LLMs, as on the
# current ones. They describe the house voice, not machine habits.
ai-tells.ColonUsage = NO
ai-tells.EmptyPadding = NO
ai-tells.FormalTransitions = NO
ai-tells.FormalRegister = NO
ai-tells.FillerIntensifier = NO
ai-tells.Metacommentary = NO
ai-tells.RestatementMarkers = NO
ai-tells.ParallelStaccato = NO

# The 2019 docs use these sparingly, not never: keep them in view, unforced.
ai-tells.EmDashUsage = suggestion
ai-tells.SemicolonUsage = suggestion

# GitBook writes its blocks as `{% hint %}`, `{% tabs %}` and so on. Markdown
# has no idea what those are, so Vale reads the directives as prose and reports
# `endhint` and `endstepper` as misspellings. They are markup: skip them.
TokenIgnores = ({%.*?%})

# An mdsvex component whose props span lines -- `<TermApp` alone on its line
# -- is not a complete tag, so Markdown reads the props as prose. Skip the
# self-closing multi-line form; a single-line tag parses as HTML on its own,
# and a paired tag's body is prose that should stay linted.
BlockIgnores = (?s) *(<[A-Z][A-Za-z]*\n.*?/>)

# Instruction files for agents are prompts: lint them with Prompts instead.
[*{AGENTS,CLAUDE}.md]
BasedOnStyles = Prompts
